swagger: '2.0'
info:
  title: Bank Argent API documentation
  description: Contains all available API endpoints in this codebase
  version: '1.0.0'
  termsOfService: 'http://swagger.io/terms/'
host: localhost:3001
basePath: /api/v1
schemes:
  - http
paths:
  /user/login:
    post:
      tags:
        - User Module
      summary: Login
      description: API for Login
      parameters:
        - in: body
          name: body
          description: Login Payload
          required: true
          schema:
            $ref: '#/definitions/Login'
      produces:
        - application/json
      responses:
        '200':
          description: Login Successfully
          schema:
            $ref: '#/definitions/LoginResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /user/signup:
    post:
      tags:
        - User Module
      summary: Signup
      description: API for Signup
      parameters:
        - in: body
          name: body
          description: Signup Payload
          required: true
          schema:
            $ref: '#/definitions/User'
      produces:
        - application/json
      responses:
        '200':
          description: Signup Successfully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /user/profile:
    get:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: User Profile API
      description: API for fetching a user profile
      produces:
        - application/json
      responses:
        '200':
          description: User profile retrieved successully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
    put:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: User Profile API
      description: API for updating a user profile
      parameters:
        - in: body
          name: body
          description: Update user profile attributes
          required: true
          schema:
            $ref: '#/definitions/UserProfile'
      produces:
        - application/json
      responses:
        '200':
          description: User profile retrieved successully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid Fields
        '500':
          description: Internal Server Error
  /accounts:
    get:
      security:
        - Bearer: []
      tags:
        - Account Module
      summary: User Accounts API
      description: API for fetching all accounts of the authenticated user
      produces:
        - application/json
      responses:
        '200':
          description: Accounts retrieved successfully
          schema:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              body:
                type: array
                items:
                  $ref: '#/definitions/Account'
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
          
  /accounts/{accountId}/transactions:
    get:
      security:
        - Bearer: []
      tags:
        - Transaction Module
      summary: Account Transactions API
      description: API for fetching all transactions of a specific account for the current month
      parameters:
        - in: path
          name: accountId
          required: true
          type: string
          description: ID of the account
        - in: query
          name: month
          required: false
          type: string
          description: Month to filter transactions (format YYYY-MM, defaults to current month)
        - in: query
          name: sort
          required: false
          type: string
          description: Sort field (date, amount, description)
        - in: query
          name: order
          required: false
          type: string
          enum: [asc, desc]
          description: Sort order (asc or desc)
      produces:
        - application/json
      responses:
        '200':
          description: Transactions retrieved successfully
          schema:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              body:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/definitions/Transaction'
                  pagination:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      totalItems:
                        type: integer
                      itemsPerPage:
                        type: integer
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User does not own this account
        '404':
          description: Account not found
        '500':
          description: Internal Server Error
          
  /transactions/{transactionId}:
    get:
      security:
        - Bearer: []
      tags:
        - Transaction Module
      summary: Transaction Details API
      description: API for fetching details of a specific transaction
      parameters:
        - in: path
          name: transactionId
          required: true
          type: string
          description: ID of the transaction
      produces:
        - application/json
      responses:
        '200':
          description: Transaction details retrieved successfully
          schema:
            type: object
            properties:
              status:
                type: integer
              message:
                type: string
              body:
                $ref: '#/definitions/Transaction'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User does not own this transaction
        '404':
          description: Transaction not found
        '500':
          description: Internal Server Error
          
    patch:
      security:
        - Bearer: []
      tags:
        - Transaction Module
      summary: Update Transaction API
      description: API for updating information of a specific transaction
      parameters:
        - in: path
          name: transactionId
          required: true
          type: string
          description: ID of the transaction
        - in: body
          name: body
          description: Transaction information to update
          required: true
          schema:
            type: object
            properties:
              category:
                type: string
                description: Category to assign to the transaction
              notes:
                type: string
                description: Notes to add to the transaction
              description:
                type: string
                description: Updated description for the transaction
      produces:
        - application/json
      responses:
        '200':
          description: Transaction updated successfully
          schema:
            $ref: '#/definitions/ApiResponse'
        '400':
          description: Invalid fields
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User does not own this transaction
        '404':
          description: Transaction not found
        '500':
          description: Internal Server Error
          
    delete:
      security:
        - Bearer: []
      tags:
        - Transaction Module
      summary: Reset Transaction Modifications API
      description: API for removing custom modifications (category, notes, custom description) from a transaction
      parameters:
        - in: path
          name: transactionId
          required: true
          type: string
          description: ID of the transaction
      produces:
        - application/json
      responses:
        '200':
          description: Transaction modifications cleared successfully
          schema:
            $ref: '#/definitions/ApiResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - User does not own this transaction
        '404':
          description: Transaction not found
        '500':
          description: Internal Server Error      

securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header

definitions:
  User:
    properties:
      email:
        type: string
        description: user email
      password:
        type: string
        description: user password
      firstName:
        type: string
        description: user first name
      lastName:
        type: string
        description: user last name
      userName:
        type: string
        description: user public name
  Login:
    properties:
      email:
        type: string
        description: user email
      password:
        type: string
        description: user password
  ApiResponse:
    type: object
    properties:
      status:
        type: integer
        description: HTTP status
      message:
        type: string
        description: response message
      body:
        type: object
        properties:
          id:
            type: string
            description: user id
          email:
            type: string
            description: user email
  LoginResponse:
    type: object
    properties:
      token:
        type: string
        description: Bearer token
  UserProfile:
    type: object
    properties:
      userName:
        type: string
        description: user public name
  Account:
    type: object
    properties:
      id:
        type: string
        description: account id
      userId:
        type: string
        description: user id who owns this account
      accountType:
        type: string
        description: type of account (e.g., Checking, Savings)
      accountName:
        type: string
        description: account name
      balance:
        type: number
        format: float
        description: current balance
      currency:
        type: string
        description: currency code (e.g., USD, EUR)
      createdAt:
        type: string
        format: date-time
        description: account creation date
  Transaction:
    type: object
    properties:
      id:
        type: string
        description: transaction id
      accountId:
        type: string
        description: associated account id
      date:
        type: string
        format: date-time
        description: transaction date
      description:
        type: string
        description: transaction description
      amount:
        type: number
        format: float
        description: transaction amount
      type:
        type: string
        enum: [credit, debit]
        description: transaction type
      category:
        type: string
        description: transaction category
      notes:
        type: string
        description: user notes about the transaction